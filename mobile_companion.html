<body>
  <iframe id="camera" allow="camera *;autoplay;fullscreen;screen-wake-lock"></iframe><div class="shade"></div>
  <header><div class="line"><div class="brand">CAPTURA GEMINI</div><div class="state"><span id="led" class="led"></span><span id="connection">Conectando…</span></div><button id="catalogToggle" type="button">ARTÍCULOS · <span id="selectionCount">0</span></button></div><div id="article">Esperando artículo seleccionado…</div><div id="refs"></div><div id="selectionSummary">Ningún artículo marcado</div></header>
  <div id="still"><div id="cropStage"><img id="stillImage" alt="Fotografía capturada"><div id="cropBox" class="crop-box" aria-label="Área de recorte"><span class="crop-handle" data-corner="nw"></span><span class="crop-handle" data-corner="ne"></span><span class="crop-handle" data-corner="sw"></span><span class="crop-handle" data-corner="se"></span></div></div></div>
  <footer><div id="message">Permita la cámara y mantenga esta pestaña abierta.</div><div class="review-tools"><button id="resetCrop" type="button">Sin recorte</button><button id="squareCrop" type="button">Recorte 1:1</button><select id="qualityProfile" aria-label="Calidad de guardado"><option value="standard">Estándar mejorada · máx. 60 KB</option><option value="detail">Detalle / texto · máx. 60 KB</option></select></div><div class="buttons"><button id="capture" disabled>HACER FOTO</button><button id="skip" disabled>Saltar artículo</button><button id="retake">Repetir</button><button id="confirm">Confirmar y guardar</button></div></footer>
  <section id="catalogPanel" aria-label="Catálogo de artículos"><div class="catalog-head"><div class="catalog-title"><strong>SELECCIONAR ARTÍCULOS</strong><span id="catalogStatus">Esperando conexión…</span></div><div class="catalog-search"><input id="catalogQuery" type="search" maxlength="80" autocomplete="off" placeholder="ID, nombre o referencia"><select id="catalogFilter"><option>Sin imagen</option><option>Todos</option><option>Con imagen</option><option>Añadidas por Captura Gemini</option></select></div><div class="catalog-pager"><button id="previousPage" type="button" disabled>← 80 anteriores</button><span id="pageInfo">Página 1</span><button id="nextPage" type="button" disabled>80 siguientes →</button></div></div><div id="catalogResults"><div class="catalog-empty">Abra la conexión para consultar el catálogo.</div></div><div class="catalog-actions"><button id="clearSelection" type="button">Limpiar selección</button><button id="closeCatalog" type="button">Listo</button></div></section>
  <script>
  (()=>{"use strict";
    const params=new URLSearchParams(location.hash.slice(1)),stream=params.get("s")||"",token=params.get("t")||"",expiresAt=Number(params.get("e")||0),origin="https://isolated.vdo.ninja",channel="gemini-mobile-v1",byId=id=>document.getElementById(id),iframe=byId("camera"),article=byId("article"),refs=byId("refs"),selectionSummary=byId("selectionSummary"),selectionCount=byId("selectionCount"),led=byId("led"),connection=byId("connection"),message=byId("message"),capture=byId("capture"),confirm=byId("confirm"),retake=byId("retake"),skip=byId("skip"),still=byId("still"),stillImage=byId("stillImage"),cropStage=byId("cropStage"),cropBox=byId("cropBox"),resetCropButton=byId("resetCrop"),squareCropButton=byId("squareCrop"),qualityProfile=byId("qualityProfile"),catalogToggle=byId("catalogToggle"),catalogQuery=byId("catalogQuery"),catalogFilter=byId("catalogFilter"),catalogStatus=byId("catalogStatus"),catalogResults=byId("catalogResults"),previousPage=byId("previousPage"),nextPage=byId("nextPage"),pageInfo=byId("pageInfo");
    let currentArticle=null,selectedIds=new Set(),catalogItems=[],pendingCapture=null,previewTransfer=null,paired=false,cameraReady=false,searchTimer=null,latestRequestId="",currentPage=0,totalPages=1,cropState={x:0,y:0,width:1,height:1},cropGesture=null;

    const css=btoa("#controlButtons,#subControlButtons,#header,#head1,#helpbutton{display:none!important}body{background:#101014!important}");iframe.src=`${origin}/?push=${encodeURIComponent(stream)}&webcam&facing=rear&quality=1&noaudio&autostart&cleanish&secure&cssb64=${encodeURIComponent(css)}`;

    function setArticle(data){currentArticle=data&&data.id?data:null;if(!currentArticle){article.textContent="Seleccione uno o varios artículos";refs.textContent="Abra ARTÍCULOS para buscar en el catálogo"}else{article.textContent=`#${currentArticle.id} · ${currentArticle.name||"Artículo sin descripción"}`;refs.textContent=`Interna: ${currentArticle.internal_ref||"—"} · Fabricante: ${currentArticle.manufacturer_ref||"—"}`}updateButtons();renderCatalog()}
    function applyDesktopSelection(values){selectedIds=new Set((values||[]).map(Number).filter(id=>Number.isInteger(id)&&id>0).slice(0,200));if(currentArticle&&!selectedIds.has(Number(currentArticle.id)))selectedIds.add(Number(currentArticle.id));updateSelectionSummary();renderCatalog()}

    function toggleArticle(item,checked){const id=Number(item.id);if(checked){selectedIds.add(id);if(!currentArticle)setArticle(item)}else{selectedIds.delete(id);if(currentArticle&&Number(currentArticle.id)===id){const nextId=Array.from(selectedIds)[0],nextItem=catalogItems.find(value=>Number(value.id)===nextId);setArticle(nextItem||(nextId?{id:nextId,name:"Artículo seleccionado"}:null))}}sendSelection()}
    function renderCatalog(){if(!catalogResults||!catalogItems)return;catalogResults.replaceChildren();if(!catalogItems.length){const empty=document.createElement("div");empty.className="catalog-empty";empty.textContent=paired?"No hay artículos que coincidan con la búsqueda.":"Esperando conexión con el PC…";catalogResults.appendChild(empty);return}catalogItems.forEach(item=>{const id=Number(item.id),row=document.createElement("div");row.className="catalog-item"+(currentArticle&&Number(currentArticle.id)===id?" active":"");const check=document.createElement("input");check.type="checkbox";check.checked=selectedIds.has(id);check.setAttribute("aria-label",`Marcar artículo ${id}`);check.addEventListener("change",event=>{event.stopPropagation();toggleArticle(item,check.checked)});const copy=document.createElement("div");copy.className="catalog-copy";const name=document.createElement("div");name.className="catalog-name";name.textContent=`#${id} · ${item.name||"Artículo sin descripción"}`;const itemRefs=document.createElement("div");itemRefs.className="catalog-refs";itemRefs.textContent=`${item.internal_ref||"—"} · ${item.manufacturer_ref||"—"}`;copy.append(name,itemRefs);copy.addEventListener("click",()=>chooseArticle(item));const badge=document.createElement("span");badge.className="photo-badge"+(item.has_photo?"":" missing");badge.textContent=item.has_photo?(item.captured_by_gemini?"CAPTURA":"CON FOTO"):"SIN FOTO";badge.addEventListener("click",()=>chooseArticle(item));row.append(check,copy,badge);catalogResults.appendChild(row)})}
    function requestCatalog(page=0){if(!paired)return;currentPage=Math.max(0,Number(page)||0);latestRequestId=`${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;catalogStatus.textContent="Cargando página…";previousPage.disabled=true;nextPage.disabled=true;send({type:"catalog_request",request_id:latestRequestId,query:catalogQuery.value.trim(),filter:catalogFilter.value,page:currentPage})}
    function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
    function imageBounds(){const sw=cropStage.clientWidth,sh=cropStage.clientHeight,nw=stillImage.naturalWidth,nh=stillImage.naturalHeight;if(!sw||!sh||!nw||!nh)return null;const scale=Math.min(sw/nw,sh/nh),width=nw*scale,height=nh*scale;return{x:(sw-width)/2,y:(sh-height)/2,width,height,naturalWidth:nw,naturalHeight:nh}}
    function renderCrop(){const bounds=imageBounds();if(!bounds||!pendingCapture){cropBox.classList.remove("ready");return}cropBox.style.left=`${bounds.x+cropState.x*bounds.width}px`;cropBox.style.top=`${bounds.y+cropState.y*bounds.height}px`;cropBox.style.width=`${cropState.width*bounds.width}px`;cropBox.style.height=`${cropState.height*bounds.height}px`;cropBox.classList.add("ready")}
    function resetCropSelection(){cropState={x:0,y:0,width:1,height:1};renderCrop()}
    function setSquareCrop(){const nw=stillImage.naturalWidth,nh=stillImage.naturalHeight;if(!nw||!nh)return;if(nw>=nh){const width=nh/nw;cropState={x:(1-width)/2,y:0,width,height:1}}else{const height=nw/nh;cropState={x:0,y:(1-height)/2,width:1,height}}renderCrop()}
    function cropPayload(){const c=cropState;if(Math.abs(c.x)<.002&&Math.abs(c.y)<.002&&Math.abs(c.width-1)<.002&&Math.abs(c.height-1)<.002)return null;return{x:Number(c.x.toFixed(6)),y:Number(c.y.toFixed(6)),width:Number(c.width.toFixed(6)),height:Number(c.height.toFixed(6))}}
    function beginCrop(event){if(!pendingCapture)return;const bounds=imageBounds();if(!bounds)return;event.preventDefault();const corner=event.target.dataset.corner||"move";cropGesture={pointerId:event.pointerId,corner,startX:event.clientX,startY:event.clientY,start:{...cropState},bounds};cropBox.setPointerCapture?.(event.pointerId)}
    function moveCrop(event){if(!cropGesture||event.pointerId!==cropGesture.pointerId)return;event.preventDefault();const g=cropGesture,dx=(event.clientX-g.startX)/g.bounds.width,dy=(event.clientY-g.startY)/g.bounds.height,s=g.start,min=.08;if(g.corner==="move"){cropState={x:clamp(s.x+dx,0,1-s.width),y:clamp(s.y+dy,0,1-s.height),width:s.width,height:s.height}}else{let left=s.x,top=s.y,right=s.x+s.width,bottom=s.y+s.height;if(g.corner.includes("w"))left=clamp(s.x+dx,0,right-min);if(g.corner.includes("e"))right=clamp(s.x+s.width+dx,left+min,1);if(g.corner.includes("n"))top=clamp(s.y+dy,0,bottom-min);if(g.corner.includes("s"))bottom=clamp(s.y+s.height+dy,top+min,1);cropState={x:left,y:top,width:right-left,height:bottom-top}}renderCrop()}
    function endCrop(event){if(cropGesture&&event.pointerId===cropGesture.pointerId)cropGesture=null}
    function leaveReview(text){pendingCapture=null;previewTransfer=null;cropGesture=null;cropState={x:0,y:0,width:1,height:1};cropBox.classList.remove("ready");stillImage.removeAttribute("src");still.classList.remove("show");document.body.classList.remove("review");updateButtons();confirm.disabled=false;message.textContent=text||"Cámara preparada para otra fotografía."}
    window.addEventListener("message",event=>{if(event.source!==iframe.contentWindow||event.origin!==origin)return;const envelope=event.data&&event.data.dataReceived;if(!envelope||envelope.channel!==channel||envelope.token!==token)return;if(envelope.type==="pair_expired"){fatal(envelope.message||"El QR ha caducado. Genere uno nuevo desde Captura Gemini.")}else if(envelope.type==="state"){cameraReady=Boolean(envelope.camera_ready);setPaired(true,cameraReady?"Conectado":"Emparejado");setArticle(envelope.article);applyDesktopSelection(envelope.selected_ids);message.textContent=pendingCapture?"Ajuste recorte y calidad antes de guardar.":(cameraReady?"Encuadre el producto y pulse HACER FOTO.":"Esperando señal de cámara…")}else if(envelope.type==="catalog_result"){if(envelope.request_id&&envelope.request_id!==latestRequestId)return;if(!envelope.ok){catalogItems=[];catalogStatus.textContent="Error";message.textContent=envelope.message||"No se pudo consultar el catálogo."}else{catalogItems=Array.isArray(envelope.items)?envelope.items:[];currentPage=Number(envelope.page||0);totalPages=Math.max(1,Number(envelope.total_pages||1));const total=Number(envelope.total||0),pageSize=Number(envelope.page_size||80),start=total?currentPage*pageSize+1:0,end=total?start+catalogItems.length-1:0;catalogStatus.textContent=`${start}-${end} de ${total}`;pageInfo.textContent=`Página ${currentPage+1} de ${totalPages}`;previousPage.disabled=!envelope.has_previous;nextPage.disabled=!envelope.has_next}renderCatalog()}else if(envelope.type==="selection_result"&&!envelope.ok){message.textContent=envelope.message||"El PC rechazó la selección."}else if(envelope.type==="preview_start"){previewTransfer={id:envelope.capture_id,total:envelope.total,chunks:[]};message.textContent="Recibiendo previsualización…"}else if(envelope.type==="preview_chunk"&&previewTransfer&&previewTransfer.id===envelope.capture_id){previewTransfer.chunks[envelope.index]=envelope.data}else if(envelope.type==="preview_end"&&previewT     stillImage.addEventListener("load",()=>requestAnimationFrame(resetCropSelection));window.addEventListener("resize",renderCrop);cropBox.addEventListener("pointerdown",beginCrop);cropBox.addEventListener("pointermove",moveCrop);cropBox.addEventListener("pointerup",endCrop);cropBox.addEventListener("pointercancel",endCrop);resetCropButton.addEventListener("click",resetCropSelection);squareCropButton.addEventListener("click",setSquareCrop);
    capture.addEventListener("click",()=>{if(!currentArticle||!paired||!cameraReady)return;capture.disabled=true;const id=`${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;message.textContent="Capturando…";send({type:"capture_request",capture_id:id,article_id:currentArticle.id});setTimeout(()=>{if(!pendingCapture)updateButtons()},6000)});retake.addEventListener("click",()=>{if(pendingCapture)send({type:"discard_capture",capture_id:pendingCapture});leaveReview("Encuadre de nuevo y pulse HACER FOTO.")});confirm.addEventListener("click",()=>{if(!pendingCapture||!currentArticle)return;confirm.disabled=true;message.textContent="Recortando y guardando en el PC…";send({type:"confirm_capture",capture_id:pendingCapture,article_id:currentArticle.id,crop:cropPayload(),quality_profile:qualityProfile.value});setTimeout(()=>{confirm.disabled=false},7000)});skip.addEventListener("click",()=>{if(!currentArticle)return;skip.disabled=true;send({type:"skip_article",article_id:currentArticle.id});setTimeout(updateButtons,2500)});
    iframe.addEventListener("load",()=>send({type:"hello",client:"mobile",version:2}));setInterval(()=>{if(!paired)send({type:"hello",client:"mobile",version:2})},1600);setInterval(()=>{if(paired)send({type:"ping",at:Date.now()})},5000);setPaired(false);updateSelectionSummary()
